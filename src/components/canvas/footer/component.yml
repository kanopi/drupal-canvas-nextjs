name: Footer
machineName: footer
status: true
required: []
props:
  properties:
    variation:
      type: string
      enum: ["primary", "secondary", "tertiary", "accent", "muted", "light", "dark"]
      meta:enum:
        primary: Primary
        secondary: Secondary
        tertiary: Tertiary
        accent: Accent
        muted: Muted
        light: Light
        dark: Dark
      title: Variation
      description: Background color for this component. Leave empty for the default.
    topBackgroundColor:
      type: string
      title: Top Background Color
      description: CSS color for the top section background. Spans full width.
    middleBackgroundColor:
      type: string
      title: Middle Background Color
      description: CSS color for the middle section background. Spans full width.
    bottomBackgroundColor:
      type: string
      title: Bottom Background Color
      description: CSS color for the bottom section background. Spans full width.
    width:
      type: string
      enum: ["100%", "90%", "80%", "75%", "50%"]
      meta:enum:
        "100%": "100%"
        "90%": "90%"
        "80%": "80%"
        "75%": "75%"
        "50%": "50%"
      title: Width
      examples:
        - "100%"
    marginTop:
      type: string
      enum: ["16", "32", "64"]
      meta:enum:
        "16": Small
        "32": Medium
        "64": Large
      title: Margin Top
    marginBottom:
      type: string
      enum: ["16", "32", "64"]
      meta:enum:
        "16": Small
        "32": Medium
        "64": Large
      title: Margin Bottom
    paddingTop:
      type: string
      enum: ["16", "32", "64"]
      meta:enum:
        "16": Small
        "32": Medium
        "64": Large
      title: Padding Top
    paddingBottom:
      type: string
      enum: ["16", "32", "64"]
      meta:enum:
        "16": Small
        "32": Medium
        "64": Large
      title: Padding Bottom
slots:
  top:
    title: Top
    description: Primary footer content — navigation menus, branding, newsletter signup.
  middle:
    title: Middle
    description: Secondary content — social links, partner logos, certifications.
  bottom:
    title: Bottom
    description: Legal — copyright text, legal links, privacy policy.
