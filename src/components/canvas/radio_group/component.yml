name: Radio Group
machineName: radio_group
status: true
description: "Options are template placeholders. In production, options are populated from Drupal field data."
required: []
props:
  properties:
    label:
      type: string
      title: Label
      description: The legend text for the radio group
      examples:
        - Choose a plan
    name:
      type: string
      title: Name
      description: The name attribute shared by all radio buttons
      examples:
        - plan
    required:
      type: boolean
      title: Required
      description: Whether a selection is required
      examples:
        - false
    option1Label:
      type: string
      title: Option 1 Label
      examples:
        - Free
    option1Value:
      type: string
      title: Option 1 Value
      examples:
        - free
    option2Label:
      type: string
      title: Option 2 Label
      examples:
        - Pro
    option2Value:
      type: string
      title: Option 2 Value
      examples:
        - pro
    option3Label:
      type: string
      title: Option 3 Label
      examples:
        - Enterprise
    option3Value:
      type: string
      title: Option 3 Value
      examples:
        - enterprise
    option4Label:
      type: string
      title: Option 4 Label
    option4Value:
      type: string
      title: Option 4 Value
    option5Label:
      type: string
      title: Option 5 Label
    option5Value:
      type: string
      title: Option 5 Value
    defaultValue:
      type: string
      title: Default Value
      description: The value of the option that should be selected by default
      examples:
        - free
