name: Field
machineName: field
status: true
required: []
props:
  properties:
    label:
      type: string
      title: Label
      description: The label text for the field
      examples:
        - Email Address
    description:
      type: string
      title: Description
      description: Help text displayed below the control
      examples:
        - Enter your primary email address.
    required:
      type: boolean
      title: Required
      description: Whether to show a required indicator on the label
      examples:
        - false
    errorMessage:
      type: string
      title: Error Message
      description: Validation error message displayed in red
      examples:
        - This field is required.
slots:
  control:
    title: Control
    description: The form control element (input, select, textarea, etc.)
