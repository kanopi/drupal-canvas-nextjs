name: Hero
machineName: hero
status: true
required: []
props:
  properties:
    title:
      type: string
      title: Title
      description: The main heading text for the hero section.
      examples:
        - Welcome to Our Site
    backgroundImage:
      type: object
      $ref: json-schema-definitions://canvas.module/image
      title: Background Image
      examples:
        - src: https://images.unsplash.com/photo-1497366216548-37526070297c
          alt: Hero background
          width: 1920
          height: 1080
    headingElement:
      type: string
      enum: ["h1", "h2", "h3", "h4", "h5", "h6"]
      meta:enum:
        h1: Heading 1
        h2: Heading 2
        h3: Heading 3
        h4: Heading 4
        h5: Heading 5
        h6: Heading 6
      title: Heading Element
      examples:
        - h1
    heroHeight:
      type: string
      enum: ["auto", "small", "medium", "large", "full"]
      meta:enum:
        auto: Auto
        small: Small (30vh)
        medium: Medium (60vh)
        large: Large (80vh)
        full: Full Screen
      title: Hero Height
      examples:
        - medium
    variation:
      type: string
      enum: ["primary", "secondary", "tertiary", "accent", "muted", "light", "dark"]
      meta:enum:
        primary: Primary
        secondary: Secondary
        tertiary: Tertiary
        accent: Accent
        muted: Muted
        light: Light
        dark: Dark
      title: Variation
      description: Background color for this component. Leave empty for the default.
    imageOverlay:
      type: string
      enum: ["dark", "light", "none"]
      meta:enum:
        dark: Dark (darken image for light text)
        light: Light (lighten image for dark text)
        none: None (no overlay)
      title: Image Overlay
      description: Tint applied over the background image to maintain text contrast. The active scheme controls the tint color; this prop picks which tone (or none).
      examples:
        - dark
    contentWidth:
      type: string
      enum: ["100%", "90%", "80%", "75%", "50%"]
      meta:enum:
        "100%": "100%"
        "90%": "90%"
        "80%": "80%"
        "75%": "75%"
        "50%": "50%"
      title: Content Width
      examples:
        - "75%"
    marginTop:
      type: string
      enum: ["16", "32", "64"]
      meta:enum:
        "16": Small
        "32": Medium
        "64": Large
      title: Margin Top
    marginBottom:
      type: string
      enum: ["16", "32", "64"]
      meta:enum:
        "16": Small
        "32": Medium
        "64": Large
      title: Margin Bottom
    paddingTop:
      type: string
      enum: ["16", "32", "64"]
      meta:enum:
        "16": Small
        "32": Medium
        "64": Large
      title: Padding Top
    paddingBottom:
      type: string
      enum: ["16", "32", "64"]
      meta:enum:
        "16": Small
        "32": Medium
        "64": Large
      title: Padding Bottom
slots:
  content:
    title: Content
    description: The main content area of the hero section.
