name: Alert
machineName: alert
status: true
required: []
props:
  properties:
    title:
      type: string
      title: Title
      description: The alert title text
      examples:
        - Heads up!
    description:
      type: string
      contentMediaType: text/html
      x-formatting-context: block
      title: Description
      examples:
        - <p>You can add components to your app using the CLI.</p>
    variant:
      type: string
      enum: ["default", "info", "warning", "danger", "success"]
      meta:enum:
        default: Default
        info: Info
        warning: Warning
        danger: Danger
        success: Success
      title: Variant
      examples:
        - info
    headingElement:
      type: string
      enum: ["h1", "h2", "h3", "h4", "h5", "h6"]
      meta:enum:
        h1: Heading 1
        h2: Heading 2
        h3: Heading 3
        h4: Heading 4
        h5: Heading 5
        h6: Heading 6
      title: Heading Element
      examples:
        - h5
    marginTop:
      type: string
      enum: ["16", "32", "64"]
      meta:enum:
        "16": Small
        "32": Medium
        "64": Large
      title: Margin Top
    marginBottom:
      type: string
      enum: ["16", "32", "64"]
      meta:enum:
        "16": Small
        "32": Medium
        "64": Large
      title: Margin Bottom
    paddingTop:
      type: string
      enum: ["16", "32", "64"]
      meta:enum:
        "16": Small
        "32": Medium
        "64": Large
      title: Padding Top
    paddingBottom:
      type: string
      enum: ["16", "32", "64"]
      meta:enum:
        "16": Small
        "32": Medium
        "64": Large
      title: Padding Bottom
