name: Dark Mode Switch
machineName: dark_mode_switch
status: true
required: []
props:
  properties:
    label:
      type: string
      title: Label
      description: Visually hidden label for the switch (screen readers).
      examples:
        - 'Toggle dark mode'
    showLabel:
      type: boolean
      title: Show Label
      description: When enabled, the label renders next to the switch instead of being visually hidden.
      examples:
        - false
