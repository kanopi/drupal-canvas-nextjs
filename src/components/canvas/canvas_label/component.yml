name: Label
machineName: canvas_label
status: true
required: []
props:
  properties:
    labelText:
      type: string
      title: Label Text
      description: The text content of the label
      examples:
        - Email Address
    htmlFor:
      type: string
      title: HTML For
      description: The id of the form element this label is associated with
      examples:
        - email
    required:
      type: boolean
      title: Required
      description: Whether to show a required indicator
      examples:
        - false
