name: Select
machineName: canvas_select
status: true
description: "Options are template placeholders. In production, options are populated from Drupal field data."
required: []
props:
  properties:
    label:
      type: string
      title: Label
      description: The label text for the select field
      examples:
        - Choose an option
    placeholder:
      type: string
      title: Placeholder
      description: Placeholder text shown as the default option
      examples:
        - Select...
    required:
      type: boolean
      title: Required
      description: Whether the select is required
      examples:
        - false
    helpText:
      type: string
      title: Help Text
      description: Optional help text displayed below the select
      examples:
        - Please select one option.
    name:
      type: string
      title: Name
      description: The name attribute for the select field
      examples:
        - category
    option1Label:
      type: string
      title: Option 1 Label
      examples:
        - Option One
    option1Value:
