name: Card
machineName: card
status: true
required: []
props:
  properties:
    title:
      type: string
      title: Title
      description: The card title text
      examples:
        - Card Title
    description:
      type: string
      contentMediaType: text/html
      x-formatting-context: block
      title: Description
      examples:
        - <p>A brief description of the card content.</p>
    image:
      type: object
      $ref: json-schema-definitions://canvas.module/image
      title: Image
      examples:
        - src: https://images.unsplash.com/photo-1506744038136-46273834b3fb
          alt: Card image
          width: 400
          height: 300
    cardLink:
      type: string
      format: uri-reference
      title: Card Link
      description: URL that wraps the entire card in a clickable link
      examples:
        - /products/example
    cardStyle:
      type: string
      enum: ["default", "icon", "horizontal"]
      meta:enum:
        default: Default
        icon: Icon Card
        horizontal: Horizontal Card
      title: Card Style
      examples:
        - default
    headingElement:
      type: string
      enum: ["h1", "h2", "h3", "h4", "h5", "h6"]
      meta:enum:
        h1: Heading 1
        h2: Heading 2
        h3: Heading 3
        h4: Heading 4
        h5: Heading 5
        h6: Heading 6
      title: Heading Element
      examples:
        - h3
    variation:
      type: string
      enum: ["primary", "secondary", "tertiary", "accent", "muted", "light", "dark"]
      meta:enum:
        primary: Primary
        secondary: Secondary
        tertiary: Tertiary
        accent: Accent
        muted: Muted
        light: Light
        dark: Dark
      title: Variation
      description: Background color for this component. Leave empty for the default.
slots:
  footer:
    title: Footer
    description: The footer area of the card
