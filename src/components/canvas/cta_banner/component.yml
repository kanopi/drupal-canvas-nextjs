name: CTA Banner
machineName: cta_banner
status: true
required: []
props:
  properties:
    title:
      type: string
      title: Title
      description: The heading text for the CTA banner.
      examples:
        - Ready to Get Started?
    description:
      type: string
      contentMediaType: text/html
      x-formatting-context: block
      title: Description
      examples:
        - <p>Join thousands of users who trust our platform.</p>
    buttonLabel:
      type: string
      title: Button Label
      description: Text label for the call-to-action button.
      examples:
        - Sign Up Now
    buttonLink:
      type: string
      format: uri-reference
      title: Button Link
      examples:
        - /sign-up
    headingElement:
      type: string
      enum: ["h1", "h2", "h3", "h4", "h5", "h6"]
      meta:enum:
        h1: Heading 1
        h2: Heading 2
        h3: Heading 3
        h4: Heading 4
        h5: Heading 5
        h6: Heading 6
      title: Heading Element
      examples:
        - h2
    variation:
      type: string
      enum: ["primary", "secondary", "tertiary", "accent", "muted", "light", "dark"]
      meta:enum:
        primary: Primary
        secondary: Secondary
        tertiary: Tertiary
        accent: Accent
        muted: Muted
        light: Light
        dark: Dark
      title: Variation
      description: Background color for this component. Leave empty for the default.
    contentWidth:
      type: string
      enum: ["100%", "90%", "80%", "75%", "50%"]
      meta:enum:
        "100%": "100%"
        "90%": "90%"
        "80%": "80%"
        "75%": "75%"
        "50%": "50%"
      title: Content Width
      examples:
        - "75%"
    marginTop:
      type: string
      enum: ["16", "32", "64"]
      meta:enum:
        "16": Small
        "32": Medium
        "64": Large
      title: Margin Top
    marginBottom:
      type: string
      enum: ["16", "32", "64"]
      meta:enum:
        "16": Small
        "32": Medium
        "64": Large
      title: Margin Bottom
    paddingTop:
      type: string
      enum: ["16", "32", "64"]
      meta:enum:
        "16": Small
        "32": Medium
        "64": Large
      title: Padding Top
    paddingBottom:
      type: string
      enum: ["16", "32", "64"]
      meta:enum:
        "16": Small
        "32": Medium
        "64": Large
      title: Padding Bottom
