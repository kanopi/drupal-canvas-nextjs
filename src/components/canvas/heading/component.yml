        "16": Small
        "32": Medium
        "64": Large
      title: Margin Bottom
    paddingTop:
      type: string
      enum: ["16", "32", "64"]
      meta:enum:
        "16": Small
        "32": Medium
        "64": Large
      title: Padding Top
    paddingBottom:
      type: string
      enum: ["16", "32", "64"]
