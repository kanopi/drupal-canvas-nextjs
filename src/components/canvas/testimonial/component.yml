name: Testimonial
machineName: testimonial
status: true
required: []
props:
  properties:
    quote:
      type: string
      contentMediaType: text/html
      x-formatting-context: block
      title: Quote
      examples:
        - <p>This product changed the way we work. Highly recommended!</p>
    author:
      type: string
      title: Author
      description: Name of the person giving the testimonial.
      examples:
        - Jane Doe
    role:
      type: string
      title: Role
      description: Job title or role of the author.
      examples:
        - CEO, Acme Corp
    avatarImage:
      type: object
      $ref: json-schema-definitions://canvas.module/image
      title: Avatar Image
      examples:
        - src: https://images.unsplash.com/photo-1472099645785-5658abf4ff4e
          alt: Author avatar
          width: 96
          height: 96
